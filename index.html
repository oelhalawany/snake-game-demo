<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f172a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #e2e8f0;
    user-select: none;
    -webkit-user-select: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(90vw, 480px);
    font-size: 18px;
    font-weight: 600;
  }

  .header .score {
    color: #34d399;
  }
  .header .best {
    color: #fbbf24;
  }

  #wrap {
    position: relative;
    width: min(90vw, 480px);
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    background: #1e293b;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #1e293b;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 20px;
  }

  #overlay.hidden { display: none; }

  #overlay h1 { font-size: 34px; letter-spacing: 1px; }
  #overlay p { font-size: 16px; color: #94a3b8; }
  #overlay .final { font-size: 22px; font-weight: 700; color: #34d399; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    font-size: 17px;
    font-weight: 700;
    color: #0f172a;
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 6px 20px rgba(52, 211, 153, 0.35);
    transition: transform 0.08s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    color: #64748b;
    font-size: 13px;
  }
  .controls kbd {
    background: #334155;
    color: #e2e8f0;
    border-radius: 5px;
    padding: 2px 7px;
    font-family: inherit;
    font-size: 12px;
  }

  /* D-pad for touch devices */
  #dpad {
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
  }
  #dpad .btn {
    background: #334155;
    color: #e2e8f0;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
  }
  #dpad .btn.empty { background: transparent; pointer-events: none; }

  @media (pointer: coarse) {
    #dpad { display: grid; }
    .keys-hint { display: none; }
  }
</style>
</head>
<body>

  <div class="header">
    <span>🐍 Snake</span>
    <span>Score: <span class="score" id="score">0</span> &nbsp;·&nbsp; Best: <span class="best" id="best">0</span></span>
  </div>

  <div id="wrap">
    <canvas id="game" width="600" height="600"></canvas>
    <div id="overlay">
      <h1 id="title">🐍 Snake</h1>
      <p id="subtitle">Eat the food, avoid yourself. Walls wrap around!</p>
      <p class="final" id="final" style="display:none;"></p>
      <button id="startBtn">Start Game</button>
      <div class="controls keys-hint">
        Use <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
      </div>
    </div>
  </div>

  <div id="dpad">
    <div class="btn empty"></div>
    <div class="btn" data-dir="up">▲</div>
    <div class="btn empty"></div>
    <div class="btn" data-dir="left">◀</div>
    <div class="btn empty"></div>
    <div class="btn" data-dir="right">▶</div>
    <div class="btn empty"></div>
    <div class="btn" data-dir="down">▼</div>
    <div class="btn empty"></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const finalEl = document.getElementById('final');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;               // cells per row/col
  const CELL = canvas.width / GRID;
  const BEST_KEY = 'snake-best';

  let snake, dir, nextDir, food, score, best, alive, timer, speed;
  let isRunning = false;

  best = Number(localStorage.getItem(BEST_KEY)) || 0;
  bestEl.textContent = best;

  function resetGame() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid,     y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid }
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 140;                 // ms per tick, speeds up as you score
    alive = true;
    scoreEl.textContent = score;
    placeFood();
    draw();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function tick() {
    if (!alive) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wrap through walls (pass to the opposite side)
    if (head.x < 0) head.x = GRID - 1;
    else if (head.x >= GRID) head.x = 0;
    if (head.y < 0) head.y = GRID - 1;
    else if (head.y >= GRID) head.y = 0;

    // self collision
    if (snake.some((s, i) => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      // speed up a little, down to a floor of 60ms
      speed = Math.max(60, speed - 3);
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem(BEST_KEY, String(best));
      }
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, speed);
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    draw();
    showOverlay('💀 Game Over', `You scored ${score} points.`, `Best: ${best}`, 'Play Again');
  }

  function showOverlay(title, subtitle, finalText, btnLabel) {
    titleEl.textContent = title;
    subtitleEl.textContent = subtitle;
    finalEl.style.display = finalText ? 'block' : 'none';
    finalEl.textContent = finalText || '';
    startBtn.textContent = btnLabel;
    overlay.classList.remove('hidden');
  }

  function startGame() {
    resetGame();
    overlay.classList.add('hidden');
    if (timer) clearInterval(timer);
    isRunning = true;
    timer = setInterval(tick, speed);
  }

  function setDirection(nx, ny) {
    // prevent reversing into yourself
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  // ----- drawing -----
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // subtle checkerboard
    ctx.fillStyle = 'rgba(148,163,184,0.05)';
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    // food
    drawFood();

    // snake
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      const r = Math.round(52 + t * 30);
      const g = Math.round(211 - t * 80);
      const b = Math.round(153 - t * 60);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const pad = 1;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      // eye on head
      if (i === 0) drawEyes(seg);
    });
  }

  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const rad = CELL * 0.35;
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx - rad * 0.3, cy - rad * 0.3, rad * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#fecaca';
    ctx.fill();
  }

  function drawEyes(head) {
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const look = (dir.x + dir.y) !== 0 ? dir : { x: 1, y: 0 };
    const eyeOff = CELL * 0.18;
    const fwd = CELL * 0.22;
    ctx.fillStyle = '#fff';
    for (const s of [-1, 1]) {
      const ex = cx + look.x * fwd + -look.y * eyeOff * s;
      const ey = cy + look.y * fwd +  look.x * eyeOff * s;
      ctx.beginPath();
      ctx.arc(ex, ey, CELL * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(ex + look.x * 2.5, ey + look.y * 2.5, CELL * 0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
    }
  }

  // ----- input -----
  const KEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', (e) => {
    const k = KEYS[e.code];
    if (k) {
      e.preventDefault();
      if (isRunning) setDirection(k[0], k[1]);
    } else if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!isRunning) startGame();
    }
  });

  // swipe support on the canvas
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart || !isRunning) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // tap
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // on-screen D-pad
  document.querySelectorAll('#dpad .btn[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!isRunning) return;
      const d = btn.dataset.dir;
      if (d === 'up') setDirection(0, -1);
      else if (d === 'down') setDirection(0, 1);
      else if (d === 'left') setDirection(-1, 0);
      else setDirection(1, 0);
    });
  });

  startBtn.addEventListener('click', startGame);

  // initial board preview behind overlay
  resetGame();
})();
</script>
</body>
</html>
